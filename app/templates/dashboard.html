{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .dashboard-container {
            display: flex;
            flex-wrap: wrap; /* Permite quebra de linha em telas menores */
            justify-content: space-around; /* Espaçamento entre os gráficos */
            gap: 20px; /* Espaçamento entre os elementos */
            padding: 20px;
        }

        .chart-container {
            flex: 1 1 30%; /* Os gráficos ocupam até 30% do espaço disponível */
            min-width: 300px; /* Largura mínima para evitar distorções */
            text-align: center;
        }

        canvas {
            width: 100%; /* Ajusta o canvas ao tamanho do contêiner */
            height: auto; /* Proporção automática */
        }
    </style>
</head>
<body>
    <h1>Dashboard</h1>

    <div class="dashboard-container">
        <div class="chart-container">
            <h2>Agendamentos por Barbearia</h2>
            <canvas id="barbeariaChart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Clientes por Barbeiro</h2>
            <canvas id="barbeiroChart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Horários Mais Populares</h2>
            <canvas id="horariosChart"></canvas>
        </div>
    </div>

    <script>
        // Agendamentos por Barbearia
        const barbeariaCtx = document.getElementById('barbeariaChart').getContext('2d');
        new Chart(barbeariaCtx, {
            type: 'bar',
            data: {
                labels: {{ labels_barbearia|safe }},
                datasets: [{
                    label: 'Agendamentos',
                    data: {{ data_barbearia|safe }},
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        // Clientes por Barbeiro
        const barbeiroCtx = document.getElementById('barbeiroChart').getContext('2d');
        new Chart(barbeiroCtx, {
            type: 'pie',
            data: {
                labels: {{ labels_barbeiro|safe }},
                datasets: [{
                    label: 'Clientes',
                    data: {{ data_barbeiro|safe }},
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.5)',
                        'rgba(54, 162, 235, 0.5)',
                        'rgba(255, 206, 86, 0.5)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: { responsive: true }
        });

        // Horários mais populares
        const horariosCtx = document.getElementById('horariosChart').getContext('2d');
        new Chart(horariosCtx, {
            type: 'line',
            data: {
                labels: {{ labels_horarios|safe }},
                datasets: [{
                    label: 'Agendamentos',
                    data: {{ data_horarios|safe }},
                    backgroundColor: 'rgba(54, 100, 235, 0.5)',
                    borderColor: 'rgba(54, 100, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>
</html>
{% endblock %}
